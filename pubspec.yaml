name: fit_track
description: "FitTrack : A fitness & health tracking application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Local Storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.4

  # UI & Fonts
  google_fonts: ^8.1.0

  # Charts
  fl_chart: ^1.2.0

  # Media
  image_picker: ^1.1.2

  # Notifications
  flutter_local_notifications: ^21.0.0

  # Networking
  http: ^1.2.2

  # Internationalization
  intl: ^0.20.2

  # Security
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
